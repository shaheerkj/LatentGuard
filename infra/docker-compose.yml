services:
  mongo:
    image: mongo:6.0
    container_name: latentguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: latentguard
    volumes:
      - mongo-data:/data/db
    networks:
      - latentguard

  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: latentguard-juiceshop
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: unsafe   # keeps all intentional vulns enabled for WAF demos
    networks:
      - latentguard

  ml:
    build:
      context: ../ml
      dockerfile: Dockerfile
    container_name: latentguard-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: latentguard
      CSIC_DIR: /app/csic_raw
      # Operator auth (shared with the Go proxy via JWT_SECRET). On first
      # boot, if the Mongo `users` collection is empty, the ML service
      # seeds the first admin from BOOTSTRAP_ADMIN_USER /
      # BOOTSTRAP_ADMIN_PASSWORD_HASH (or the legacy ADMIN_USER /
      # ADMIN_PASSWORD_HASH names below, kept for backwards-compat with
      # pre-RBAC deployments). Subsequent users are managed from the
      # dashboard's Users tab. Override the hash with a real bcrypt
      # value before exposing this stack -- the default is the
      # FYP-demo password documented in documentation/04-setup.md.
      ADMIN_USER: "shaheerkj"
      ADMIN_PASSWORD_HASH: "$$2b$$12$$nb3EVaoj8KMD2s2OtwCrN.6gL91P7lfE3EzUu45FXgtcrTm75cnRe"
      JWT_SECRET: "dev-only-secret-change-me-for-anything-non-local"
      JWT_TTL_HOURS: "12"
      # M9/M10: shared dir with the proxy where promoted rules land.
      # Same named volume on both sides so the ML side can write files
      # the proxy's Coraza engine picks up on /__reload.
      LG_GENERATED_RULES_DIR: "/etc/coraza/rules/lg-generated"
      PROXY_RELOAD_URL: "http://proxy:8080/__reload"
      # LLM_PROVIDER: stub|openai|anthropic. Defaults to stub (no key needed).
      # LLM_PROVIDER selects the rule-synthesis backend (see
      # ml/app/rulegen/orchestrator.py). Valid: stub | gemini | openai |
      # anthropic. Falls back to stub when the chosen provider's API key
      # is missing or unreachable, so the pipeline keeps working without
      # an API budget. For Gemini Flash (free tier, no credit card):
      #   1. https://aistudio.google.com/app/apikey -> create key
      #   2. set GEMINI_API_KEY below, flip LLM_PROVIDER to "gemini"
      LLM_PROVIDER: "stub"
      # GEMINI_API_KEY: ""
      # GEMINI_MODEL: "gemini-1.5-flash-latest"   # override only if you have paid tier access
    volumes:
      - ../ml/models:/app/models      # trained artifacts persist & are host-editable
      - ../datasets/raw:/app/csic_raw # cached CSIC downloads
      - lg-generated-rules:/etc/coraza/rules/lg-generated
    depends_on:
      - mongo
    networks:
      - latentguard

  proxy:
    build:
      context: ../proxy
      dockerfile: Dockerfile
    container_name: latentguard-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      PROXY_LISTEN: ":8080"
      PROXY_TLS_LISTEN: ":8443"
      # PROXY_TLS_CERT / PROXY_TLS_KEY left unset -> proxy auto-generates a
      # self-signed cert at startup (24h validity, localhost SAN). For prod,
      # mount a real cert into /etc/certs and set the two env vars.
      PROXY_UPSTREAM: "http://juiceshop:3000"
      ML_URL: "http://ml:8000"
      ML_TIMEOUT_MS: "1000"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "latentguard"
      CORAZA_RULES_DIR: "/etc/coraza/rules"
      # Module 3 / FE-2: threat-intel blocklist. Defaults pull Spamhaus
      # DROP + EDROP (free, no API key, ~1.5k CIDRs total). Override
      # THREATINTEL_URL to a comma-separated list of plain-text CIDR feeds
      # (FireHOL, AbuseIPDB exports, internal blocklists, etc.).
      THREATINTEL_ENABLED: "true"
      THREATINTEL_URL: "https://www.spamhaus.org/drop/drop.txt,https://www.spamhaus.org/drop/edrop.txt"
      THREATINTEL_REFRESH_HOURS: "12"
      THREATINTEL_TIMEOUT_SEC: "20"
      # Same JWT secret as the ML service -- proxy verifies the same tokens
      # the dashboard receives from /api/auth/login. /__healthz stays public
      # so docker healthchecks still work; /__threatintel and /__safe-mode
      # require a valid bearer token.
      JWT_SECRET: "dev-only-secret-change-me-for-anything-non-local"
    depends_on:
      - mongo
      - ml
      - juiceshop
    volumes:
      # M9/M10: shared dir holding promoted rules from the ML service.
      # Coraza's loadRuleFiles walks rulesDir recursively for *.conf so
      # files under lg-generated/ are picked up on the next Reload().
      - lg-generated-rules:/etc/coraza/rules/lg-generated
    networks:
      - latentguard

  dashboard:
    image: nginx:1.26-alpine
    container_name: latentguard-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ../dashboard:/usr/share/nginx/html:ro
    networks:
      - latentguard

volumes:
  mongo-data:
  lg-generated-rules:

networks:
  latentguard:
    driver: bridge
