# LatentGuard threat-intel blocklist (Module 3 / FE-2).
#
# The .data file is REGENERATED at runtime by the threat-intel goroutine in
# cmd/proxy/main.go (see internal/threatintel/fetcher.go). On boot it pulls
# Spamhaus DROP + EDROP (or whatever sources THREATINTEL_URL points at),
# parses CIDRs, writes threatintel.data atomically next to this file, then
# asks the Coraza engine to Reload() so @ipMatchFromFile picks up new entries.
#
# Rule ID space 1500000-1599999 is reserved for threat-intel rules so it
# doesn't collide with our baseline (1000000-1099999), CRS (900000+), or
# AI-generated rules from M9 (2000000+).
#
# Phase 1 is deliberate: source-IP block fires BEFORE request-body inspection,
# saving the work of running content rules against traffic we already know
# we're going to drop.

SecRule REMOTE_ADDR "@ipMatchFromFile threatintel.data" \
    "id:1500001,phase:1,deny,status:403,severity:'CRITICAL',\
     msg:'Threat intel: source IP on blocklist',\
     logdata:'remote_addr=%{REMOTE_ADDR}',\
     tag:'threat-intel',tag:'latentguard/blocklist'"
